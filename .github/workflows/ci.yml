name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          prune-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen

      - name: Fetch Typst
        run: bash scripts/fetch_typst.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run bundle

      - run: uv run ruff check app tests
      - run: uv run pytest -q

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: |
          LETTER_ALLOW_HTTP_ORIGINS=1 uv run uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          python tests/mock_dav.py &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/healthz >/dev/null && break
            sleep 1
          done
          node tests/e2e.mjs

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ron-ronzz-org/letter:latest
            ghcr.io/ron-ronzz-org/letter:${{ github.sha }}
